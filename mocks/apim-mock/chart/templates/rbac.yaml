apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "apim-mock.fullname" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apim-mock.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "apim-mock.fullname" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apim-mock.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "apim-mock.fullname" . }}-state
subjects:
  - kind: ServiceAccount
    name: {{ include "apim-mock.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.credentialSecrets.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "apim-mock.fullname" . }}-credentials
  labels:
    {{- include "apim-mock.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "apim-mock.fullname" . }}-credentials
  labels:
    {{- include "apim-mock.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "apim-mock.fullname" . }}-credentials
subjects:
  - kind: ServiceAccount
    name: {{ include "apim-mock.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
