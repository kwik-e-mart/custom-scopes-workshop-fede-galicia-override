apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apim-mock.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apim-mock.labels" . | nindent 4 }}
type: Opaque
stringData:
  MOCK_TOKEN: {{ required "mock.token es obligatorio: es el Bearer que manda el service (API_SUBSCRIBER_TOKEN del agente)" .Values.mock.token | quote }}
  {{- if and .Values.npApiKey.value (not .Values.npApiKey.existingSecret) }}
  {{ .Values.npApiKey.key }}: {{ .Values.npApiKey.value | quote }}
  {{- end }}
