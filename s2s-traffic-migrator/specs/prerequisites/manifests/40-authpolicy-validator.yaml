apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: s2s-validator
  namespace: gateways
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: s2s-ingress
  rules:
    authentication:
      local-__APP_NAMESPACE__:
        jwt:
          jwksUrl: http://__LOCAL_JWKS_NAME__.kuadrant-system.svc.cluster.local:8080/__APP_NAMESPACE__/jwks.json
          ttl: 300
        credentials:
          customHeader:
            name: x-egress-token
      peer-__APP_NAMESPACE__:
        jwt:
          jwksUrl: http://__PEER_JWKS_NAME__.kuadrant-system.svc.cluster.local:8080/__APP_NAMESPACE__/jwks.json
          ttl: 300
        credentials:
          customHeader:
            name: x-egress-token
    authorization:
      claims-esperados:
        patternMatching:
          patterns:
            - predicate: auth.identity.iss == "__EGRESS_ISSUER__"
            - predicate: auth.identity.src_namespace == "__APP_NAMESPACE__"
    response:
      unauthenticated:
        message:
          value: "falta el token de egreso en x-egress-token, o no lo firmó ninguna clave conocida"
      unauthorized:
        message:
          value: "el token no corresponde a un namespace habilitado en este ingreso"
      success: {}
