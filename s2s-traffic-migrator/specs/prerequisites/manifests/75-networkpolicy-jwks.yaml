apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authorino-jwks
  namespace: __APP_NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app: jwks-egress
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kuadrant-system
      ports:
        - protocol: TCP
          port: 8080
