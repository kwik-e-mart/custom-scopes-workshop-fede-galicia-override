provider_categories:
  - container-orchestration
configuration:
  S2S_TRAFFIC_MIGRATOR_SIGNING_STRATEGY: cluster-keys
  JWKS_SERVICE_NAME: jwks-egress
  INGRESS_AUTHPOLICY: s2s-validator
  TOKEN_DURATION: "60"
  LISTEN_PORT: "8080"
  GITOPS_PATH_PREFIX: intra-namespace-rules
  GITOPS_PUSH_RETRIES: "5"
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/k8s/build_context
    output:
      - { name: NAMESPACE, type: environment }
      - { name: INTERCEPTIONS_JSON, type: environment }
      - { name: SERVICE_ID, type: environment }
      - { name: WRISTBAND_SECRET, type: environment }
      - { name: EGRESS_ISSUER, type: environment }
      - { name: SIGNING_STRATEGY, type: environment }
      - { name: KEYGEN_IMAGE, type: environment }
      - { name: VAULT_APPROLE_ROLE_ID, type: environment }
      - { name: VAULT_APPROLE_SECRET, type: environment }
      - { name: VAULT_SECRET_STORE, type: environment }
      - { name: LOCAL_JWKS_URL, type: environment }
      - { name: PEER_JWKS_URL, type: environment }
      - { name: INGRESS_GATEWAY_NAME, type: environment }
      - { name: VAULT_KV_MOUNT, type: environment }
      - { name: VAULT_KV_CLUSTER, type: environment }
      - { name: JWKS_SERVICE_NAME, type: environment }
      - { name: JWKS_IMAGE, type: environment }
      - { name: NETWORKING_VAULT_ADDR, type: environment }
      - { name: NETWORKING_VAULT_NAMESPACE, type: environment }
      - { name: NETWORKING_VAULT_SPIFFE_MOUNT, type: environment }
      - { name: NETWORKING_VAULT_SPIFFE_ROLE, type: environment }
      - { name: NETWORKING_VAULT_TOKEN_SECRET, type: environment }
      - { name: PEER_CA_SECRET, type: environment }
      - { name: PEER_GATEWAY_HOST, type: environment }
      - { name: LOCAL_INGRESS_HOST, type: environment }
      - { name: LOCAL_INGRESS_TLS_MODE, type: environment }
      - { name: LOCAL_INGRESS_SERVICE, type: environment }
      - { name: LOCAL_INGRESS_SERVICE_NAMESPACE, type: environment }
      - { name: GATEWAY_NAMESPACE, type: environment }
      - { name: INGRESS_AUTHPOLICY, type: environment }
      - { name: CLUSTER_LABEL, type: environment }
      - { name: LISTEN_PORT, type: environment }
      - { name: TOKEN_DURATION, type: environment }
      - { name: GATEWAY_CLASS, type: environment }
      - { name: GITOPS_BRANCH, type: environment }
      - { name: GITOPS_PATH_PREFIX, type: environment }
      - { name: GITOPS_PUSH_RETRIES, type: environment }
      - { name: SIGLA, type: environment }
  - name: reconcile delete
    type: script
    file: $SERVICE_PATH/scripts/k8s/reconcile
    configuration: { ARGS: delete }
