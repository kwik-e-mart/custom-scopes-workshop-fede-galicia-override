provider_categories:
  - scope-configurations
steps:
  - name: add_sigla_label
    type: script
    after: build context
    file: "$OVERRIDES_PATH/deployment/scripts/add_sigla_label"
  - name: mount_certificates
    type: script
    after: create deployment
    file: "$OVERRIDES_PATH/deployment/scripts/mount_certificates"
  - name: inject_appdynamics_env
    type: script
    after: create deployment
    file: "$OVERRIDES_PATH/deployment/scripts/inject_appdynamics_env"
  - name: set_application_user
    type: script
    after: create deployment
    file: "$OVERRIDES_PATH/deployment/scripts/set_application_user"
  - name: strip_s2s_headers
    type: script
    after: create deployment
    file: "$OVERRIDES_PATH/deployment/scripts/strip_s2s_headers"
  - name: add_topology_spread_constraints
    type: script
    after: create deployment
    file: "$OVERRIDES_PATH/deployment/scripts/add_topology_spread_constraints"